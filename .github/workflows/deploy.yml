name: 部署到 Cloudflare Pages

on:
  push:
    branches: [master, preview]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 打包静态文件（游戏本体 + 贴图 + 美术资源，不含密钥和工具）
        run: |
          mkdir -p dist/src dist/assets
          cp index.html dist/
          cp src/*.js dist/src/
          cp assets/sprites dist/assets/ -r
          cp "assets/圣魂村-俯视地图.jpeg" "assets/天空云影-裁剪.jpeg" dist/assets/

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 分支名直接透传给 Cloudflare：推 master → 正式版，推 preview → 独立预览
          # 地址（preview.land-8aq.pages.dev），互不影响。用于上线前试跑那些
          # 只能靠眼睛验的改动（帧率、夜色、贴图观感）。
          command: pages deploy dist --project-name=land --branch=${{ github.ref_name }}
