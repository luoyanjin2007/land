name: 部署到 Cloudflare Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 打包静态文件（游戏本体 + 贴图 + 开场画，不含密钥和工具）
        run: |
          mkdir -p dist/src dist/assets
          cp index.html dist/
          cp src/*.js dist/src/
          cp assets/sprites dist/assets/ -r
          cp "assets/圣魂村-俯视地图.jpeg" dist/assets/

      - name: 部署到 Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=land --branch=master
